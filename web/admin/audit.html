<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Audit logs</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <div class="layout">
      <div id="nav"></div>
      <h1>Audit logs</h1>
      <div class="card" style="display:flex;flex-wrap:wrap;gap:12px;align-items:end">
        <div class="field" style="margin:0;min-width:220px">
          <label for="action">Action filter</label>
          <input id="action" placeholder="e.g. user.suspend" list="actions" />
          <datalist id="actions">
            <option value="user.update"></option>
            <option value="user.suspend"></option>
            <option value="user.activate"></option>
            <option value="user.enable_sync"></option>
            <option value="user.disable_sync"></option>
            <option value="user.enable_feed"></option>
            <option value="user.disable_feed"></option>
            <option value="device.revoke"></option>
            <option value="source_identity.reset"></option>
            <option value="calendar.rotate_token"></option>
            <option value="invitation.create"></option>
            <option value="invitation.delete"></option>
          </datalist>
        </div>
        <div class="field" style="margin:0;min-width:100px">
          <label for="limit">Limit</label>
          <input id="limit" type="number" min="10" max="200" value="100" />
        </div>
        <button id="reload" type="button" class="secondary">Reload</button>
      </div>
      <div id="content">Loading…</div>
    </div>
    <script src="/js/api.js"></script>
    <script>
      async function loadLogs() {
        const action = document.getElementById('action').value.trim();
        const limit = document.getElementById('limit').value || '100';
        const qs = new URLSearchParams({ limit });
        if (action) qs.set('action', action);
        const data = await adminApi(`/api/admin/audit-logs?${qs}`);
        document.getElementById('content').innerHTML = data.logs.length
          ? `<div class="card"><table>
              <tr><th>Time</th><th>Actor</th><th>Action</th><th>Target</th><th>Request</th><th>Metadata</th></tr>
              ${data.logs.map((l) => `<tr>
                <td>${formatDateTime(l.createdAt)}</td>
                <td>${l.actorDisplayName || l.actorType}<br><span class="mono muted">${l.actorUserId?.slice(0, 8) || ''}</span></td>
                <td class="mono">${l.action}</td>
                <td>${l.targetDisplayName || '—'}<br><span class="mono muted">${l.targetUserId?.slice(0, 8) || ''}</span></td>
                <td class="mono">${l.requestId ? l.requestId.slice(0, 8) : '—'}</td>
                <td class="mono">${typeof l.metadata === 'object' ? JSON.stringify(l.metadata) : (l.metadata || '{}')}</td>
              </tr>`).join('')}
            </table></div>`
          : '<div class="card"><p>No audit logs.</p></div>';
      }
      async function main() {
        document.getElementById('nav').innerHTML = renderAdminNav('audit.html');
        if (!(await requireAdmin())) return;
        document.getElementById('reload').addEventListener('click', loadLogs);
        await loadLogs();
      }
      main().catch((e) => { document.getElementById('content').textContent = e.message; });
    </script>
  </body>
</html>
