[project]
name = "seqta-link"
version = "3.1.2"
description = "Seqta Link — self-hosted SEQTA timetable sync with iCalendar feed"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "flask>=3.1",
  "flask-sqlalchemy>=3.1",
  "flask-migrate>=4.0",
  "python-dotenv>=1.0",
  "argon2-cffi>=23.1",
  "gunicorn>=22.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[project.scripts]
seqta-link = "seqta_link.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["seqta_link*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
