<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Timetable · Seqta Link</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <div class="layout">
      <div id="nav"></div>
      <h1>Timetable</h1>
      <div class="card">
        <div class="field">
          <label for="from">From</label>
          <input id="from" type="date" />
        </div>
        <div class="field">
          <label for="until">Until</label>
          <input id="until" type="date" />
        </div>
        <button id="loadBtn" type="button">Load</button>
      </div>
      <div id="content"></div>
    </div>
    <script src="/js/api.js"></script>
    <script>
      function defaultRange() {
        const from = new Date();
        const until = new Date(Date.now() + 14 * 86400000);
        document.getElementById('from').value = from.toISOString().slice(0, 10);
        document.getElementById('until').value = until.toISOString().slice(0, 10);
      }
      async function load() {
        const from = document.getElementById('from').value;
        const until = document.getElementById('until').value;
        const data = await api(`/api/me/timetable?from=${from}&until=${until}`);
        if (!data.events.length) {
          document.getElementById('content').innerHTML = '<div class="card"><p>No events in this range.</p></div>';
          return;
        }
        document.getElementById('content').innerHTML = `
          <div class="card"><table>
            <thead><tr><th>Date</th><th>Period</th><th>Title</th><th>Teacher</th><th>Room</th><th>Status</th></tr></thead>
            <tbody>${data.events.map((e) => `
              <tr>
                <td>${e.localDate}</td>
                <td>${e.periodKey}</td>
                <td>${e.title}</td>
                <td>${e.teacher || '—'}</td>
                <td>${e.room || '—'}</td>
                <td>${e.status}</td>
              </tr>`).join('')}</tbody>
          </table></div>`;
      }
      async function main() {
        document.getElementById('nav').innerHTML = renderNav('timetable.html');
        await requireAuth();
        defaultRange();
        document.getElementById('loadBtn').addEventListener('click', () => load().catch(showError));
        await load();
      }
      function showError(err) {
        showPageError('content', err);
      }
      main().catch(showError);
    </script>
  </body>
</html>
