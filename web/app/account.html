<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Account · Seqta Link</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <div class="layout">
      <div id="nav"></div>
      <h1>Account</h1>
      <div id="content">Loading…</div>
    </div>
    <script src="/js/api.js"></script>
    <script>
      async function main() {
        document.getElementById('nav').innerHTML = renderNav('account.html');
        const me = await requireAuth();
        if (!me) return;
        document.getElementById('content').innerHTML = `
          <div class="card">
            <p><strong>${me.user.displayName}</strong></p>
            <p>${me.user.email || 'No email on file'}</p>
            <p>Role: ${me.user.role}</p>
            <div class="field">
              <label for="calendarName">Calendar display name</label>
              <input id="calendarName" value="${me.calendar.name}" />
            </div>
            <button id="saveBtn" type="button">Save preferences</button>
            <button id="logoutBtn" class="secondary" type="button">Sign out</button>
            <p id="msg"></p>
          </div>
          <div class="card">
            <h2>Change password</h2>
            <div class="field">
              <label for="currentPassword">Current password</label>
              <input id="currentPassword" type="password" autocomplete="current-password" />
            </div>
            <div class="field">
              <label for="newPassword">New password</label>
              <input id="newPassword" type="password" autocomplete="new-password" />
            </div>
            <button id="passwordBtn" type="button">Update password</button>
            <p id="passwordMsg"></p>
          </div>`;
        document.getElementById('saveBtn').addEventListener('click', async () => {
          await api('/api/me/preferences', {
            method: 'PATCH',
            body: JSON.stringify({ calendarName: document.getElementById('calendarName').value }),
          });
          document.getElementById('msg').textContent = 'Saved.';
          document.getElementById('msg').className = 'success';
        });
        document.getElementById('logoutBtn').addEventListener('click', logout);
        document.getElementById('passwordBtn').addEventListener('click', async () => {
          try {
            await api('/api/me/password', {
              method: 'POST',
              body: JSON.stringify({
                currentPassword: document.getElementById('currentPassword').value,
                newPassword: document.getElementById('newPassword').value,
              }),
            });
            document.getElementById('passwordMsg').textContent = 'Password updated. Sign in again.';
            document.getElementById('passwordMsg').className = 'success';
            setTimeout(() => { window.location.href = '/app/login.html'; }, 800);
          } catch (err) {
            document.getElementById('passwordMsg').textContent = err.message;
            document.getElementById('passwordMsg').className = 'error';
          }
        });
      }
      main().catch((err) => showPageError('content', err));
    </script>
  </body>
</html>
