<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Accept invitation</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <div class="layout">
      <h1>Accept invitation</h1>
      <div id="content">Loading…</div>
    </div>
    <script src="/js/api.js"></script>
    <script>
      const token = new URLSearchParams(location.search).get('token');
      async function main() {
        if (!token) {
          document.getElementById('content').textContent = 'Missing invitation token.';
          return;
        }
        const preview = await fetch(`/api/invite/${token}`).then((r) => r.json());
        document.getElementById('content').innerHTML = `
          <div class="card">
            <p>You are invited as <strong>${preview.expectedName || 'a new user'}</strong>.</p>
            <p>Expires: ${formatDateTime(preview.expiresAt)}</p>
            <p><a class="btn" href="/app/login.html">Sign in to accept</a></p>
            <button id="acceptBtn" type="button">Accept invitation</button>
            <p id="msg"></p>
          </div>`;
        document.getElementById('acceptBtn').addEventListener('click', async () => {
          try {
            await api(`/api/invite/${token}/accept`, { method: 'POST', body: '{}' });
            document.getElementById('msg').textContent = 'Invitation accepted. Redirecting…';
            document.getElementById('msg').className = 'success';
            setTimeout(() => { window.location.href = '/app/dashboard.html'; }, 800);
          } catch (e) {
            document.getElementById('msg').textContent = e.message;
            document.getElementById('msg').className = 'error';
          }
        });
      }
      main().catch(() => {
        document.getElementById('content').textContent = 'Invitation not found or expired.';
      });
    </script>
  </body>
</html>
