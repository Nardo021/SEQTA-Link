<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin sign in</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <div class="layout">
      <h1>Admin sign in</h1>
      <div class="card">
        <p><a class="btn" href="/auth/login">Continue with Authentik</a></p>
        <hr />
        <div class="field">
          <label for="displayName">Dev owner name</label>
          <input id="displayName" value="Owner User" />
        </div>
        <button id="devBtn" type="button">Dev owner sign in</button>
      </div>
    </div>
    <script src="/js/admin-api.js"></script>
    <script>
      document.getElementById('devBtn').addEventListener('click', async () => {
        const displayName = document.getElementById('displayName').value.trim();
        await fetch('/auth/dev-login', {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ displayName, role: 'owner' }),
        });
        window.location.href = '/admin/dashboard.html';
      });
    </script>
  </body>
</html>
