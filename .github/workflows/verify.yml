name: Verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run backend tests
        run: python -m pytest -q

  userscript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate userscript configuration
        run: node --test Script/test-config.mjs
      - name: Build userscript
        run: npm run build:userscript
      - name: Check committed userscript matches source
        run: git diff --exit-code -- Script/seqta-calendar-sync.user.js
      - name: Publish build artifact
        uses: actions/upload-artifact@v4
        with:
          name: seqta-link-userscript
          path: Script/seqta-calendar-sync.user.js
          if-no-files-found: error
