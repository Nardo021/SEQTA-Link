{% extends "base.html" %}
{% block title %}Accept invitation{% endblock %}
{% block content %}
<h1>Create your account</h1>
{% if error %}
<div class="card"><p class="error">{{ error }}</p></div>
{% elif preview %}
<div class="card">
  {% if preview.expected_name %}<p>Invited as: <strong>{{ preview.expected_name }}</strong></p>{% endif %}
  <form method="post">
    <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required /></div>
    <div class="field"><label for="display_name">Display name</label><input id="display_name" name="display_name" value="{{ preview.expected_name or '' }}" /></div>
    <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" minlength="8" required /></div>
    <button type="submit">Create account</button>
  </form>
</div>
{% endif %}
{% endblock %}
