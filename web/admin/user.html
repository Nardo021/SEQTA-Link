<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Manage User</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <div class="layout">
      <div id="nav"></div>
      <p><a href="/admin/users.html">← Users</a></p>
      <h1>Manage user</h1>
      <div id="content">Loading…</div>
    </div>
    <script src="/js/api.js"></script>
    <script>
      const userId = new URLSearchParams(location.search).get('id');
      let displayName = '';

      function todayIso() {
        return new Date().toISOString().slice(0, 10);
      }
      function plusDaysIso(days) {
        return new Date(Date.now() + days * 86400000).toISOString().slice(0, 10);
      }
      function formatDuration(ms) {
        if (ms == null) return '—';
        if (ms < 1000) return `${ms} ms`;
        return `${(ms / 1000).toFixed(1)} s`;
      }

      async function loadPage() {
        const data = await adminApi(`/api/admin/users/${userId}`);
        const u = data.user;
        displayName = u.displayName;
        const cal = data.calendar;
        const si = data.sourceIdentity;
        document.getElementById('content').innerHTML = `
          <div class="card">
            <h2>${u.displayName}</h2>
            <p class="mono">${u.email || 'No email'}</p>
            <p>Role: ${u.role} · Status: <strong>${u.accountStatus}</strong> · Sync: ${u.syncEnabled ? 'on' : 'off'} · Feed: ${u.feedEnabled ? 'on' : 'off'} · Max devices: ${u.maxDevices}</p>
            ${cal ? `<p>Calendar: <strong>${cal.name}</strong> · revision ${cal.revision} · last sync ${formatDateTime(cal.lastSyncedAt)}</p>` : '<p class="muted">No calendar.</p>'}
            ${si ? `<p>Source identity: <span class="mono">${si.studentRef}</span> @ ${si.schoolHost}</p>` : '<p class="muted">Source identity not locked.</p>'}
            <div class="field"><label for="displayName">Display name</label><input id="displayName" value="${u.displayName.replace(/"/g, '&quot;')}" /></div>
            <div class="field"><label for="maxDevices">Max devices</label><input id="maxDevices" type="number" min="1" max="20" value="${u.maxDevices}" /></div>
            <button id="saveUser" type="button">Save profile</button>
            <p id="saveMsg"></p>
          </div>
          <div class="card">
            <h3>Actions</h3>
            <div style="display:flex;flex-wrap:wrap;gap:8px">
              <button data-action="suspend">Suspend</button>
              <button data-action="activate" class="secondary">Activate</button>
              <button data-action="disable-sync" class="secondary">Disable sync</button>
              <button data-action="enable-sync" class="secondary">Enable sync</button>
              <button data-action="disable-feed" class="secondary">Disable feed</button>
              <button data-action="enable-feed" class="secondary">Enable feed</button>
              <button data-action="rotate-token" class="secondary">Rotate calendar token</button>
              <button data-action="reset-identity" class="secondary">Reset source identity</button>
            </div>
            <pre id="out" class="mono" style="margin-top:12px"></pre>
          </div>
          <div class="card"><h3>Devices</h3><div id="devices">Loading…</div></div>
          <div class="card"><h3>Sync history</h3><div id="syncRuns">Loading…</div></div>
          <div class="card">
            <h3>Timetable</h3>
            <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin-bottom:12px">
              <div class="field" style="margin:0"><label for="from">From</label><input id="from" type="date" value="${todayIso()}" /></div>
              <div class="field" style="margin:0"><label for="until">Until</label><input id="until" type="date" value="${plusDaysIso(14)}" /></div>
              <button id="loadTt" type="button" class="secondary">Load</button>
            </div>
            <div id="timetable">Loading…</div>
          </div>`;

        document.getElementById('saveUser').addEventListener('click', async () => {
          try {
            await adminApi(`/api/admin/users/${userId}`, {
              method: 'PATCH',
              body: JSON.stringify({
                displayName: document.getElementById('displayName').value.trim(),
                maxDevices: Number(document.getElementById('maxDevices').value),
              }),
            });
            document.getElementById('saveMsg').textContent = 'Saved.';
            document.getElementById('saveMsg').className = 'success';
            await loadPage();
          } catch (err) {
            document.getElementById('saveMsg').textContent = err.message;
            document.getElementById('saveMsg').className = 'error';
          }
        });

        document.querySelectorAll('[data-action]').forEach((btn) => {
          btn.addEventListener('click', async () => {
            const action = btn.dataset.action;
            try {
              if (action === 'reset-identity') {
                const confirmName = prompt(`Type the display name to confirm reset:\n${displayName}`);
                if (confirmName == null) return;
                const result = await adminApi(`/api/admin/users/${userId}/reset-source-identity`, {
                  method: 'POST',
                  body: JSON.stringify({ confirmName }),
                });
                document.getElementById('out').textContent = JSON.stringify(result, null, 2);
                await loadPage();
                return;
              }
              if (action === 'rotate-token' && !confirm('Rotate calendar token? Existing subscriptions break until re-added.')) {
                return;
              }
              const patchBody = {
                'disable-sync': { syncEnabled: false },
                'enable-sync': { syncEnabled: true },
                'disable-feed': { feedEnabled: false },
                'enable-feed': { feedEnabled: true },
              }[action];
              let result;
              if (patchBody) {
                result = await adminApi(`/api/admin/users/${userId}`, {
                  method: 'PATCH',
                  body: JSON.stringify(patchBody),
                });
              } else {
                const path = {
                  suspend: `/api/admin/users/${userId}/suspend`,
                  activate: `/api/admin/users/${userId}/activate`,
                  'rotate-token': `/api/admin/users/${userId}/rotate-calendar-token`,
                }[action];
                result = await adminApi(path, { method: 'POST', body: '{}' });
              }
              document.getElementById('out').textContent = JSON.stringify(result, null, 2);
              await loadPage();
            } catch (err) {
              document.getElementById('out').textContent = err.message;
            }
          });
        });

        document.getElementById('loadTt').addEventListener('click', loadTimetable);
        await Promise.all([loadDevices(), loadSyncRuns(), loadTimetable()]);
      }

      async function loadDevices() {
        const devices = await adminApi(`/api/admin/users/${userId}/devices`);
        document.getElementById('devices').innerHTML = devices.devices.length
          ? `<table><tr><th>Name</th><th>Status</th><th>Prefix</th><th>Last sync</th><th></th></tr>
            ${devices.devices.map((d) => `<tr>
              <td>${d.name}</td><td>${d.status}</td><td class="mono">${d.tokenPrefix}</td>
              <td>${formatDateTime(d.lastSyncedAt)}</td>
              <td>${d.status === 'active' ? `<button data-device="${d.id}" class="revoke secondary">Revoke</button>` : ''}</td>
            </tr>`).join('')}</table>`
          : '<p>No devices.</p>';
        document.querySelectorAll('.revoke').forEach((btn) => {
          btn.addEventListener('click', async () => {
            await adminApi(`/api/admin/devices/${btn.dataset.device}/revoke`, { method: 'POST', body: '{}' });
            await loadDevices();
          });
        });
      }

      async function loadSyncRuns() {
        const data = await adminApi(`/api/admin/users/${userId}/sync-runs?limit=20`);
        document.getElementById('syncRuns').innerHTML = data.runs.length
          ? `<table>
              <tr><th>Started</th><th>Device</th><th>Status</th><th>Recv</th><th>Ins</th><th>Upd</th><th>Rem</th><th>Error</th><th>Duration</th></tr>
              ${data.runs.map((r) => `<tr>
                <td>${formatDateTime(r.startedAt)}</td>
                <td>${r.deviceName || '—'}</td>
                <td>${r.status}</td>
                <td>${r.receivedCount}</td>
                <td>${r.insertedCount}</td>
                <td>${r.updatedCount}</td>
                <td>${r.removedCount}</td>
                <td class="mono">${r.errorCode || '—'}</td>
                <td>${formatDuration(r.durationMs)}</td>
              </tr>`).join('')}
            </table>`
          : '<p>No sync runs.</p>';
      }

      async function loadTimetable() {
        const from = document.getElementById('from')?.value || todayIso();
        const until = document.getElementById('until')?.value || plusDaysIso(14);
        const tt = await adminApi(`/api/admin/users/${userId}/timetable?from=${from}&until=${until}`);
        document.getElementById('timetable').innerHTML = tt.events.length
          ? `<table><tr><th>Date</th><th>Period</th><th>Title</th><th>Room</th><th>Teacher</th><th>Status</th></tr>
            ${tt.events.map((e) => `<tr>
              <td>${e.localDate || e.date || '—'}</td>
              <td>${e.periodLabel || e.periodKey || '—'}</td>
              <td>${e.title}</td>
              <td>${e.room || '—'}</td>
              <td>${e.teacher || '—'}</td>
              <td>${e.status || '—'}</td>
            </tr>`).join('')}</table>`
          : '<p>No events in range.</p>';
      }

      async function main() {
        document.getElementById('nav').innerHTML = renderAdminNav('users.html');
        if (!(await requireAdmin()) || !userId) {
          document.getElementById('content').textContent = 'Missing user id.';
          return;
        }
        await loadPage();
      }
      main().catch((e) => { document.getElementById('content').textContent = e.message; });
    </script>
  </body>
</html>
