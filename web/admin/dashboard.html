<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <div class="layout">
      <div id="nav"></div>
      <h1>Admin Dashboard</h1>
      <div id="content">Loading…</div>
    </div>
    <script src="/js/api.js"></script>
    <script src="/js/admin-api.js"></script>
    <script>
      async function main() {
        document.getElementById('nav').innerHTML = renderAdminNav('dashboard.html');
        if (!(await requireAdmin())) return;
        const dash = await adminApi('/api/admin/dashboard');
        document.getElementById('content').innerHTML = `
          <div class="grid">
            <div class="card"><div class="stat-label">Total users</div><div class="stat-value">${dash.users.total}</div></div>
            <div class="card"><div class="stat-label">Active</div><div class="stat-value">${dash.users.active}</div></div>
            <div class="card"><div class="stat-label">Suspended</div><div class="stat-value">${dash.users.suspended}</div></div>
            <div class="card"><div class="stat-label">Pending invites</div><div class="stat-value">${dash.invitations.pending}</div></div>
          </div>`;
      }
      main().catch((e) => { document.getElementById('content').textContent = e.message; });
    </script>
  </body>
</html>
