<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Accept invitation</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <div class="layout">
      <h1>Accept invitation</h1>
      <div id="content">Loading…</div>
    </div>
    <script src="/js/api.js"></script>
    <script>
      const token = new URLSearchParams(location.search).get('token');
      async function main() {
        if (!token) {
          document.getElementById('content').textContent = 'Missing invitation token.';
          return;
        }
        const preview = await fetch(`/api/invite/${token}`).then((r) => {
          if (!r.ok) throw new Error('bad');
          return r.json();
        });
        document.getElementById('content').innerHTML = `
          <div class="card">
            <p>You are invited as <strong>${preview.expectedName || 'a new user'}</strong>.</p>
            <p>Expires: ${formatDateTime(preview.expiresAt)}</p>
            <form id="registerForm">
              <div class="field">
                <label for="email">Email</label>
                <input id="email" type="email" autocomplete="username" required />
              </div>
              <div class="field">
                <label for="displayName">Display name</label>
                <input id="displayName" type="text" value="${preview.expectedName || ''}" />
              </div>
              <div class="field">
                <label for="password">Password (min 8 characters)</label>
                <input id="password" type="password" autocomplete="new-password" minlength="8" required />
              </div>
              <button type="submit">Create account</button>
            </form>
            <p id="msg"></p>
          </div>`;
        document.getElementById('registerForm').addEventListener('submit', async (event) => {
          event.preventDefault();
          try {
            await api(`/api/invite/${token}/accept`, {
              method: 'POST',
              body: JSON.stringify({
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                displayName: document.getElementById('displayName').value,
              }),
            });
            document.getElementById('msg').textContent = 'Account created. Redirecting…';
            document.getElementById('msg').className = 'success';
            setTimeout(() => { window.location.href = '/app/dashboard.html'; }, 800);
          } catch (e) {
            document.getElementById('msg').textContent = e.message;
            document.getElementById('msg').className = 'error';
          }
        });
      }
      main().catch(() => {
        document.getElementById('content').textContent = 'Invitation not found or expired.';
      });
    </script>
  </body>
</html>
