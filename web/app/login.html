<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in · Seqta Link</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <div class="layout">
      <h1>Sign in</h1>
      <div class="card">
        <p id="status">Sign in with your email and password.</p>
        <form id="loginForm">
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="username" required />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required />
          </div>
          <button type="submit">Sign in</button>
        </form>
        <p id="msg" class="error" hidden></p>
        <p class="stat-label">New here? You need an invitation link from an administrator.</p>
      </div>
    </div>
    <script src="/js/api.js"></script>
    <script>
      async function init() {
        try {
          await api('/api/me');
          window.location.href = '/app/dashboard.html';
        } catch {}
      }
      document.getElementById('loginForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        const msg = document.getElementById('msg');
        msg.hidden = true;
        try {
          const result = await api('/auth/login', {
            method: 'POST',
            body: JSON.stringify({
              email: document.getElementById('email').value,
              password: document.getElementById('password').value,
            }),
          });
          window.location.href = result.redirect || '/app/dashboard.html';
        } catch (e) {
          msg.textContent = e.message || 'Sign in failed.';
          msg.hidden = false;
        }
      });
      init();
    </script>
  </body>
</html>
