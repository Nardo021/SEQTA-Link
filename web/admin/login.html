<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin sign in</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <div class="layout">
      <h1>Admin sign in</h1>
      <div class="card">
        <form id="loginForm">
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="username" required />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required />
          </div>
          <button type="submit">Sign in</button>
        </form>
        <p id="msg" class="error" hidden></p>
        <p class="muted"><a href="/app/login.html">User portal sign in</a></p>
      </div>
    </div>
    <script src="/js/api.js"></script>
    <script>
      document.getElementById('loginForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        const msg = document.getElementById('msg');
        msg.hidden = true;
        try {
          const body = await api('/auth/login', {
            method: 'POST',
            body: JSON.stringify({
              email: document.getElementById('email').value,
              password: document.getElementById('password').value,
            }),
          });
          const role = body?.user?.role;
          if (role !== 'owner' && role !== 'admin') {
            msg.textContent = 'This account is not an administrator.';
            msg.hidden = false;
            await api('/auth/logout', { method: 'POST', body: '{}' });
            return;
          }
          window.location.href = body.redirect || '/admin/dashboard.html';
        } catch (err) {
          msg.textContent = err.message || 'Sign in failed.';
          msg.hidden = false;
        }
      });
    </script>
  </body>
</html>
